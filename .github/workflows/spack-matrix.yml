      - name: Import test
        shell: spack-bash {0}
        run: |
          spack env activate ./env
          python -c "import scifem"

      - name: Run tests
        shell: spack-bash {0}
        run: |
          spack env activate ./env
          spack install --add py-pytest
          spack stage py-scifem@${{ matrix.version }} ${{ matrix.spec }}
          spack cd py-scifem@${{ matrix.version }} ${{ matrix.spec }}
          python -m pytest

