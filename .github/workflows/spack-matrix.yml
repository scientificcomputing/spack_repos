        version: ["main", "0.16.1", "0.14.0"]
        spec: ["+adios2+petsc+biomed+hdf5 ^petsc+mumps"]

    steps:
      - uses: actions/checkout@v6
        with:
          path: spack_repos
      - uses: ./spack_repos/.github/actions/test-package
        with:
          spec: py-scifem@${{ matrix.version }} ${{ matrix.spec }}
