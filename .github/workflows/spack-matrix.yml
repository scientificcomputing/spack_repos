  py-io4dolfinx:
    needs: style-check
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        version: ["main", "1.1.2"]
        spec:
          [
            "^py-fenics-dolfinx%c,cxx=gcc@13.3.0",
            "+adios2+h5py+xdmf+vtkhdf+pyvista ^py-fenics-dolfinx%c,cxx=gcc@13.3.0",
          ]

    steps:
      - uses: actions/checkout@v6
        with:
          path: spack_repos
      - uses: ./spack_repos/.github/actions/test-package
        with:
          spec: py-io4dolfinx@${{ matrix.version }} ${{ matrix.spec }}
          remote_repos: "https://github.com/FEniCS/spack-fenics.git"

      - name: Import test
        shell: spack-bash {0}
        run: |
          spack env activate ./env
          python -c "import io4dolfinx"

